name: Package release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release to attach packages to
        required: true
        type: string
        default: v0.1.0

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix stage
      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage\* -DestinationPath "rudy-dns-trace-$($env:RELEASE_TAG)-windows-x64.zip"
      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: tar -czf "rudy-dns-trace-${RELEASE_TAG}-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: rudy-dns-trace-${{ env.RELEASE_TAG }}-*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum rudy-dns-trace-* > SHA256SUMS.txt
      - name: Verify release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG"
      - name: Upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
